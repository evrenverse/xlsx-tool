name: Bug report
description: Report a reproducible xlsx-tool problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach confidential workbooks. Create a minimal synthetic reproduction.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: xlsx-tool v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Operating system, architecture, installation method
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command, exit code, and a minimal synthetic file if needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
